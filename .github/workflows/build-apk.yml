name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'capacitor.config.ts'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Override AGENTPHONE_SERVER_URL for this build (e.g. http://100.119.115.75:8765/launch)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Stamp build-info.json into static/
        # Gets copied into APK assets by `cap sync` below. The bundled
        # bootstrap reads it at first launch and stores into localStorage,
        # so app.js can later compare against /api/apk-info to surface an
        # in-app "🆕 build #N 可用" banner — no GitHub Actions tab needed.
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > static/build-info.json <<EOF
          {
            "runNumber": ${{ github.run_number }},
            "sha": "${{ github.sha }}",
            "shortSha": "$SHORT_SHA",
            "builtAt": "$BUILT_AT"
          }
          EOF
          cat static/build-info.json

      - name: Sync Capacitor (copy static/ → android assets)
        env:
          AGENTPHONE_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentphone-debug-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
